/* ============================================================
   3. PER-TEACHER ITINERARY COMPOSITION
   Orange = own session · Plain = festival event everyone attends
   ============================================================ */
function workshopsByTeacher(tid) {
  return Object.values(W).filter(w => w.teacher === tid);
}

function parseTimeToMin(s) {
  // "19:50" → 1190 ; safe for minute-of-day sort
  const m = /^(\d{1,2}):(\d{2})/.exec(s);
  if (!m) return 0;
  return Number(m[1]) * 60 + Number(m[2]);
}

function computeTeacherItinerary(teacher) {
  const own = workshopsByTeacher(teacher.id).map(w => ({ ...w, isOwn: true }));
  const items = [...own];

  // Friday Opening Party — all teachers
  items.push({ ...OPENING_PARTY });

  // Saturday — own tech rehearsal slot, then Grand Finale tech (all teachers
  // present), then Gala. Grand Finale tech runs at 19:50 from gidf-teachers.
  items.push({
    ...TECH_REHEARSAL_BLOCK,
    time: teacher.galaSlot,
    title: `Your tech rehearsal — Act ${teacher.galaAct}`,
    isPersonal: true,
    startMin: parseTimeToMin(teacher.galaSlot),
    desc: `${TECH_REHEARSAL_BLOCK.desc} Your slot: ${teacher.galaSlot}.`,
  });
  items.push({
    id: "techFinale", isEvent: true,
    day: "Saturday · 2 May", dayKey: "Sat",
    time: "19:50", startMin: 1190,
    title: "Grand Finale tech rehearsal",
    subtitle: "All visiting teachers on stage together",
    studio: "Studio Art Deco · Stage", floor: "1st Floor",
    desc: "Act 18 — every visiting teacher joins the Grand Finale rehearsal slot. Be on stage at 19:50 sharp.",
    isPersonal: true,
  });
  items.push({
    ...GALA,
    title: `${GALA.title} — you go on at Act ${teacher.galaAct}`,
    isPersonal: true,
    galaAct: teacher.galaAct, galaStyle: teacher.galaStyle,
  });

  // Sunday closing dinner — all teachers welcome (those who can stay)
  items.push({ ...CLOSING_DINNER });

  // Sort chronologically across days
  items.sort((a, b) => {
    const dayRank = { "Fri": 0, "Sat": 1, "Sun": 2 };
    if (dayRank[a.dayKey] !== dayRank[b.dayKey]) return dayRank[a.dayKey] - dayRank[b.dayKey];
    return a.startMin - b.startMin;
  });

  return items;
}

/* Konark Sun Temple wheel — same hairline mandala as participant pass.   */
function KonarkSun({ cx, cy, r, delay = 0, color = "#E85D1F", duration = 110, opacity = 0.18, noFade = false }) {
  const primarySpokes = Array.from({ length: 8 }, (_, i) => (i * 360) / 8);
  const secondary    = Array.from({ length: 16 }, (_, i) => 11.25 + (i * 360) / 16);
  const inner = r * 0.18;
  const mid   = r * 0.55;
  const outer = r;

  const spokeLine = (deg, len, isPrimary) => {
    const rad = (deg * Math.PI) / 180;
    return (
      <line key={deg}
        x1={inner * Math.cos(rad)} y1={inner * Math.sin(rad)}
        x2={len   * Math.cos(rad)} y2={len   * Math.sin(rad)}
        stroke={color} strokeWidth={isPrimary ? 1.4 : 0.6}
        opacity={isPrimary ? 1 : 0.7} />
    );
  };

  return (
    <motion.g
      initial={{ opacity: noFade ? opacity : 0 }}
      animate={{ opacity }}
      transition={{ duration: noFade ? 0 : 2.2, delay, ease: EASE }}
      aria-hidden="true"
    >
      <motion.g
        animate={{ rotate: 360 }}
        transition={{ duration, ease: "linear", repeat: Infinity }}
        style={{ transformOrigin: `${cx}px ${cy}px` }}
      >
        <g transform={`translate(${cx} ${cy})`} fill="none" strokeLinecap="round">
          <circle cx="0" cy="0" r={outer}        stroke={color} strokeWidth="1.0" />
          <circle cx="0" cy="0" r={outer * 0.94} stroke={color} strokeWidth="0.5" opacity="0.7" />
          <circle cx="0" cy="0" r={mid} stroke={color} strokeWidth="0.7" />
          <circle cx="0" cy="0" r={inner}       stroke={color} strokeWidth="0.9" />
          <circle cx="0" cy="0" r={inner * 0.5} stroke={color} strokeWidth="0.6" fill={color} fillOpacity="0.8" />
          {primarySpokes.map(d => spokeLine(d, outer, true))}
          {secondary.map(d => spokeLine(d, mid, false))}
          {primarySpokes.map(d => {
            const rad = (d * Math.PI) / 180;
            return (
              <circle key={`b${d}`}
                cx={outer * 0.97 * Math.cos(rad)}
                cy={outer * 0.97 * Math.sin(rad)}
                r="1.4" stroke={color} strokeWidth="0.6" fill={color} fillOpacity="0.6" />
            );
          })}
        </g>
      </motion.g>
    </motion.g>
  );
}

/* ============================================================
   10. ROOT
   ============================================================ */
function ArrivalJourney() {
  const [phase, setPhase] = useState("gate");
  const [teacher, setTeacher] = useState(null);
  const reduceMotion = useReducedMotion();

  const handlePick = (t) => {
    setTeacher(t);
    setPhase("searching");
    // brief preparing-your-pass moment, then transit
    setTimeout(() => setPhase("transit"), reduceMotion ? 600 : 1400);
  };

  // Phase auto-advance: transit (~7s) → shoonya (~10.5s) → venue (auto in component) → pass
  useEffect(() => {
    if (phase === "transit") {
      const t = setTimeout(() => setPhase("shoonya"), reduceMotion ? 1500 : 7000);
      return () => clearTimeout(t);
    }
    if (phase === "shoonya") {
      const t = setTimeout(() => setPhase("tour"), reduceMotion ? 2000 : 10500);
      return () => clearTimeout(t);
    }
    // Tour phase does NOT auto-advance — user controls pacing (31s video).
  }, [phase, reduceMotion]);

  const reset = () => { setTeacher(null); setPhase("gate"); };
  const skipToPass = () => setPhase("pass");
  const skipFromTransit = () => setPhase("shoonya");
  const skipFromShoonya = () => setPhase("tour");
  const skipFromTour = () => setPhase("venue");

  return (
    <div className="min-h-screen w-full" style={{ background: "#fff", color: "#4A4A4A" }}>
      <AnimatePresence mode="wait">
        {phase === "gate" && (
          <motion.div key="gate" {...fadeUp(0)}>
            <GatePhase onPick={handlePick} />
          </motion.div>
        )}
        {phase === "searching" && teacher && (
          <motion.div key="searching" {...fadeUp(0)}>
            <SearchingPhase teacher={teacher} />
          </motion.div>
        )}
        {phase === "transit" && teacher && (
          <motion.div key="transit" {...fadeUp(0)}>
            <TransitPhase teacher={teacher} onSkip={skipFromTransit} />
          </motion.div>
        )}
        {phase === "shoonya" && teacher && (
          <motion.div key="shoonya" {...fadeUp(0)}>
            <ShoonyaPhase onSkip={skipFromShoonya} />
          </motion.div>
        )}
        {phase === "tour" && teacher && (
          <motion.div key="tour" {...fadeUp(0)}>
            <TourPhase onContinue={skipFromTour} />
          </motion.div>
        )}
        {phase === "venue" && teacher && (
          <motion.div key="venue" {...fadeUp(0)}>
            <VenuePhase onContinue={skipToPass} />
          </motion.div>
        )}
        {phase === "pass" && teacher && (
          <motion.div key="pass" {...fadeUp(0)}>
            <FacultyPassPhase teacher={teacher} onReset={reset} />
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

/* For visiting faculty too — first look around the building before they
   explore individual floors. Phone-bezel framing on desktop, full-bleed
   on mobile. Tap-to-pause; reduce-motion users see the poster image.
   No auto-advance — teacher clicks Continue when ready. */
function TourPhase({ onContinue }) {
  const reduceMotion = useReducedMotion();
  const videoRef = useRef(null);
  const [paused, setPaused] = useState(false);
  const [ended, setEnded] = useState(false);
  // Hint visible for ~2.5s on mount so users know the stage is interactive.
  const [hintVisible, setHintVisible] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => setHintVisible(false), 2500);
    return () => clearTimeout(t);
  }, []);

  // Auto-advance ~1.2s after the video ends so the user isn't stuck if the
  // Continue button is below the fold on smaller viewports. Cancellable —
  // if the user pauses or scrolls during the lag they can still hit Continue.
  useEffect(() => {
    if (!ended) return;
    const t = setTimeout(() => onContinue(), 1200);
    return () => clearTimeout(t);
  }, [ended, onContinue]);

  // Reduce-motion users see the poster, no autoplay → no onEnded fires.
  // Give them a 4s look-then-go fallback; SkipControl is also visible.
  useEffect(() => {
    if (!reduceMotion) return;
    const t = setTimeout(() => onContinue(), 4000);
    return () => clearTimeout(t);
  }, [reduceMotion, onContinue]);

  const togglePlay = () => {
    const v = videoRef.current;
    if (!v) return;
    if (v.paused) { v.play(); setPaused(false); }
    else { v.pause(); setPaused(true); }
  };

  return (
    <section className="relative min-h-screen flex flex-col items-center justify-center px-4 sm:px-6 py-10">
      <motion.div {...fadeUp(0)} className="mb-3">
        <Eyebrow>30-second tour</Eyebrow>
      </motion.div>
      <motion.h2 {...fadeUp(0.1)} className="text-center mb-2 max-w-2xl" style={{
        fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
        fontSize: "clamp(28px, 5vw, 44px)", lineHeight: 1.1, letterSpacing: "-0.005em", color: "var(--ink)",
      }}>
        Step inside <em style={{ fontStyle: "italic", color: "var(--saffron-aa)", fontWeight: 400 }}>Shoonya.</em>
      </motion.h2>
      <motion.p {...fadeUp(0.22)} className="text-center max-w-md mb-8" style={{
        fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
        fontSize: 16, lineHeight: 1.4, color: "var(--ink)",
      }}>
        A quick walk around — so the door feels familiar when you arrive.
      </motion.p>

      <motion.div {...fadeUp(0.34)} className="tour-stage">
        {reduceMotion ? (
          <img src="./venue/shoonya-tour.jpg" alt="Inside Shoonya"
            style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        ) : (
          <button type="button" onClick={togglePlay}
            aria-label={paused ? "Play Shoonya tour" : "Pause Shoonya tour"}
            aria-pressed={!paused}
            style={{
              position: "relative", display: "block", width: "100%", height: "100%",
              padding: 0, border: "none", background: "#000", cursor: "pointer",
            }}>
            <video
              ref={videoRef}
              src="./venue/shoonya-tour.mp4"
              poster="./venue/shoonya-tour.jpg"
              autoPlay muted playsInline preload="metadata"
              onEnded={() => setEnded(true)}
              aria-hidden="true"
              style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
            />
            {paused && (
              <div style={{
                position: "absolute", inset: 0, display: "flex",
                alignItems: "center", justifyContent: "center",
                background: "rgba(0,0,0,0.55)", color: "#fff",
                fontFamily: "Inter, sans-serif", fontSize: 11,
                letterSpacing: "0.18em", textTransform: "uppercase",
              }}>Tap to play</div>
            )}
            {/* Persistent corner pause/play glyph at low opacity. WCAG 2.2.2. */}
            <div aria-hidden="true" style={{
              position: "absolute", bottom: 10, right: 10,
              width: 28, height: 28, borderRadius: "50%",
              background: "rgba(0,0,0,0.55)",
              display: "flex", alignItems: "center", justifyContent: "center",
              opacity: paused ? 0.95 : 0.45,
              transition: "opacity 0.3s ease",
              pointerEvents: "none",
            }}>
              {paused ? (
                <svg width="10" height="12" viewBox="0 0 10 12" fill="#fff" aria-hidden="true">
                  <polygon points="0,0 10,6 0,12" />
                </svg>
              ) : (
                <svg width="10" height="12" viewBox="0 0 10 12" fill="#fff" aria-hidden="true">
                  <rect x="1" y="1" width="3" height="10" />
                  <rect x="6" y="1" width="3" height="10" />
                </svg>
              )}
            </div>
            {/* On-mount hint — fades in then out so first viewers know it's tappable. */}
            {hintVisible && !paused && (
              <div className="tour-hint" style={{
                position: "absolute", bottom: 10, left: 10,
                background: "rgba(0,0,0,0.55)", color: "#fff",
                fontFamily: "Inter, sans-serif", fontSize: 10,
                letterSpacing: "0.16em", textTransform: "uppercase",
                padding: "5px 10px", pointerEvents: "none",
              }}>Tap to pause</div>
            )}
          </button>
        )}
      </motion.div>

      <motion.button
        onClick={onContinue}
        initial={{ opacity: 0 }} animate={{ opacity: 1 }}
        transition={{ duration: 0.6, delay: 1.0, ease: EASE }}
        className="mt-8"
        style={{
          fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 500,
          letterSpacing: "0.18em", textTransform: "uppercase",
          color: "var(--saffron-aa)", background: "transparent",
          /* 1px (not 0.5px hairline) — primary CTA where reliable render
             on hi-DPI matters more than the system's delicate hairline. */
          border: "1px solid var(--saffron-aa)",
          padding: "14px 26px", cursor: "pointer",
        }}>
        {ended ? "Continue →" : "Skip the tour →"}
      </motion.button>

      {/* Guaranteed bottom-right escape hatch — visible regardless of
          viewport, matches every other phase. Same handler as the
          mid-page CTA. */}
      <SkipControl onSkip={onContinue} label="Skip" color="#6B6B6B" delay={1.2} />
    </section>
  );
}

/* Floor media — accepts a string OR an array of paths. Renders <img> by
   default and <video> for .mp4/.webm/.mov. Videos honour reduce-motion
   (poster shown instead of autoplay) and tap-to-toggle play/pause. */
function FloorMedia({ src, alt }) {
  const items = Array.isArray(src) ? src : [src];
  return (
    <div className="grid gap-2" style={{ gridTemplateColumns: "1fr" }}>
      {items.map((s, i) => (
        <FloorMediaItem key={i} src={s} alt={items.length > 1 ? `${alt} (${i + 1} of ${items.length})` : alt} />
      ))}
    </div>
  );
}

function FloorMediaItem({ src, alt }) {
  const [errored, setErrored] = useState(false);
  const reduceMotion = useReducedMotion();
  const videoRef = useRef(null);
  const [paused, setPaused] = useState(false);

  if (!src || errored) return null;

  const isVideo = /\.(mp4|webm|mov)$/i.test(src);
  const poster  = isVideo ? src.replace(/\.(mp4|webm|mov)$/i, ".jpg") : null;

  if (isVideo && reduceMotion) {
    return (
      <img src={poster} alt={alt}
        onError={() => setErrored(true)}
        loading="lazy"
        style={{ width: "100%", height: "100%", objectFit: "cover", minHeight: 120, maxHeight: 240 }} />
    );
  }

  if (isVideo) {
    const togglePlay = () => {
      const v = videoRef.current;
      if (!v) return;
      if (v.paused) { v.play(); setPaused(false); }
      else { v.pause(); setPaused(true); }
    };
    return (
      <button type="button" onClick={togglePlay}
        aria-label={paused ? `Play ${alt} video` : `Pause ${alt} video`}
        aria-pressed={!paused}
        style={{
          position: "relative", display: "block", width: "100%", padding: 0, border: "none",
          background: "#000", cursor: "pointer", minHeight: 120,
        }}>
        <video ref={videoRef} src={src} poster={poster}
          autoPlay muted loop playsInline preload="metadata" aria-hidden="true"
          onError={() => setErrored(true)}
          style={{ width: "100%", height: "100%", objectFit: "cover", minHeight: 120, maxHeight: 240, display: "block" }} />
        {paused && (
          <div style={{
            position: "absolute", inset: 0, display: "flex",
            alignItems: "center", justifyContent: "center",
            background: "rgba(0,0,0,0.4)", color: "#fff",
            fontFamily: "Inter, sans-serif", fontSize: 11,
            letterSpacing: "0.18em", textTransform: "uppercase",
          }}>Tap to play</div>
        )}
      </button>
    );
  }

  return (
    <img src={src} alt={alt}
      onError={() => setErrored(true)}
      loading="lazy"
      style={{ width: "100%", height: "auto", objectFit: "cover", maxHeight: 280, display: "block" }} />
  );
}

function Barcode() {
  const widths = [2, 1, 3, 1, 2, 4, 1, 2, 1, 3, 2, 1, 4, 2, 1, 3, 1, 2, 2, 3, 1, 2, 4, 1, 2, 3, 1, 2];
  return (
    <div className="flex items-end gap-[2px]" style={{ height: 38 }}>
      {widths.map((w, i) => (
        <div key={i} style={{ width: `${w}px`, height: i % 4 === 0 ? "100%" : "82%", background: "#000" }} />
      ))}
    </div>
  );
}

/* Vertical timeline, day-aware */
function Timeline({ items }) {
  return (
    <div className="relative pl-1">
      {items.map((w, i) => {
        const prev = items[i - 1];
        const isNewDay = !prev || prev.dayKey !== w.dayKey;
        const dayLabel = w.dayKey === "Fri" ? "Friday · 1 May" : w.dayKey === "Sat" ? "Saturday · 2 May" : "Sunday · 3 May";
        return (
          <Fragment key={w.id + i}>
            {isNewDay && (
              <motion.div
                initial={{ opacity: 0, x: -6 }} animate={{ opacity: 1, x: 0 }}
                transition={{ duration: 0.5, delay: 0.45 + i * 0.05, ease: EASE }}
                className="flex items-center gap-3 my-3"
              >
                <Eyebrow color="#E85D1F">{dayLabel}</Eyebrow>
                <div className="flex-1" style={{ height: "0.5px", background: "#D6D6D6" }} />
              </motion.div>
            )}
            <TimelineNode w={w} delay={0.5 + i * 0.07} isLast={i === items.length - 1} isFirstOfDay={isNewDay} />
          </Fragment>
        );
      })}
    </div>
  );
}

function TimelineNode({ w, delay, isLast, isFirstOfDay }) {
  const [open, setOpen] = useState(false);
  const isOwn = w.isOwn;
  const isPersonal = w.isPersonal;
  const isOP = w.id === "openingParty";
  const isGala = w.id === "gala";
  const isTech = w.id === "tech";
  const isFinale = w.id === "techFinale";
  const isDinner = w.id === "closingDinner";
  const accent = isOwn ? "#C44715" : isPersonal ? "#C44715" : "#6B6B6B";
  const panelId = `tl-panel-${w.id}-${delay.toString().replace(".", "_")}`;

  return (
    <motion.div
      initial={{ opacity: 0, x: -8 }} animate={{ opacity: 1, x: 0 }}
      transition={{ duration: 0.5, delay, ease: EASE }}
      className="relative grid"
      style={{ gridTemplateColumns: "20px 1fr", columnGap: 16, marginBottom: isLast ? 0 : 4 }}
    >
      <div className="relative">
        {!isLast && (
          <div className="absolute" style={{
            left: 9, top: 14, bottom: -14, width: "1px",
            background: isFirstOfDay ? "transparent" : "#D6D6D6",
            backgroundImage: isFirstOfDay
              ? "repeating-linear-gradient(180deg, #D6D6D6 0 4px, transparent 4px 8px)"
              : "none",
          }} />
        )}
        <div className="absolute" style={{
          top: 4, left: 5, width: 10, height: 10, borderRadius: "50%",
          background: (isOwn || isPersonal) ? accent : "#fff",
          border: `1.5px solid ${accent}`,
        }} />
      </div>

      <button type="button" onClick={() => setOpen(o => !o)}
        aria-expanded={open}
        aria-controls={panelId}
        className="text-left transition-colors hover:bg-[#FAFAFA] py-1.5"
        style={{ background: "none", border: "none", cursor: "pointer", padding: 0, paddingBottom: 12, minHeight: 44 }}
      >
        <div className="flex items-baseline justify-between gap-3 flex-wrap">
          <div className="flex items-baseline gap-3 flex-wrap">
            <span className="tabular-nums" style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
              fontSize: 15, color: accent, letterSpacing: "-0.005em",
            }}>
              {w.time.split(" ")[0]}
            </span>
            <span style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
              fontSize: "clamp(15px, 2.2vw, 17px)", lineHeight: 1.25, color: "#000",
              letterSpacing: "-0.005em",
            }}>
              {w.title}
            </span>
            {isOwn && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#fff",
                background: "#C44715", padding: "2px 5px",
              }}>You're teaching</span>
            )}
            {isTech && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#fff",
                background: "#0A0A0A", padding: "2px 5px",
              }}>Tech rehearsal</span>
            )}
            {isFinale && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#fff",
                background: "#C44715", padding: "2px 5px",
              }}>All teachers</span>
            )}
            {isGala && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#C44715",
                border: "0.5px solid #C44715", padding: "2px 5px",
              }}>Gala</span>
            )}
            {isOP && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#E85D1F",
                border: "0.5px solid #E85D1F", padding: "2px 5px",
              }}>Event</span>
            )}
            {isDinner && (
              <span style={{
                fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase",
                fontFamily: "Inter, sans-serif", fontWeight: 500, color: "#000",
                background: "#FBC70F", padding: "2px 5px",
              }}>Closing</span>
            )}
          </div>
          <Chevron className="w-4 h-4" style={{ color: "#6B6B6B" }} rotate={open} />
        </div>
        <div className="mt-0.5" style={{ fontSize: 12, color: "#4A4A4A" }}>
          {w.studio && (
            <>
              {w.studio}
              {w.floor && <><Bindu /><span style={{ color: "#6B6B6B" }}>{w.floor}</span></>}
            </>
          )}
        </div>

        {/* Class monitor — only on "you're teaching" rows. */}
        {isOwn && (
          <div className="mt-1.5 inline-flex items-center gap-2"
            style={{ borderLeft: "1px solid #C44715", paddingLeft: 10 }}>
            <span style={{
              fontFamily: "Inter, sans-serif", fontWeight: 500, fontSize: 10,
              letterSpacing: "0.18em", textTransform: "uppercase", color: "#C44715",
            }}>Class monitor</span>
            <span style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
              fontSize: 13, color: "#000",
            }}>
              {w.classMonitor || (
                <em style={{ fontStyle: "italic", color: "#6B6B6B", fontWeight: 400 }}>
                  to be claimed
                </em>
              )}
            </span>
          </div>
        )}

        {/* Workshop notice (e.g. Tech Lab — bring a packed lunch). */}
        {w.notice && (
          <div className="mt-2 flex items-start gap-2"
            style={{ borderLeft: "1.5px solid #C44715", paddingLeft: 10, paddingTop: 2, paddingBottom: 2 }}>
            <span style={{
              fontFamily: "Inter, sans-serif", fontWeight: 500, fontSize: 10,
              letterSpacing: "0.18em", textTransform: "uppercase", color: "#C44715",
              flexShrink: 0, paddingTop: 1,
            }}>
              Heads up
            </span>
            <span style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
              fontSize: 13, lineHeight: 1.4, color: "#000",
            }}>
              {w.notice}
            </span>
          </div>
        )}

        <AnimatePresence initial={false}>
          {open && (
            <motion.div
              id={panelId}
              role="region"
              initial={{ height: 0, opacity: 0 }}
              animate={{ height: "auto", opacity: 1 }}
              exit={{ height: 0, opacity: 0 }}
              transition={{ duration: 0.4, ease: EASE }}
              style={{ overflow: "hidden" }}
            >
              <div className="grid sm:grid-cols-[1fr_auto] gap-5 mt-3 pt-3"
                style={{ borderTop: "0.5px dashed #E0E0E0" }}>
                <div>
                  {w.subtitle && (
                    <div className="mb-1.5" style={{
                      fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic",
                      fontSize: 14, color: "#4A4A4A",
                    }}>{w.subtitle}</div>
                  )}
                  {w.desc && (
                    <p style={{
                      fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic",
                      fontWeight: 400, fontSize: 14, lineHeight: 1.6, color: "#000",
                      margin: 0, maxWidth: "55ch",
                    }}>{w.desc}</p>
                  )}
                </div>
                <div className="grid gap-2.5 min-w-[200px]">
                  <FactRow label="Time"   value={w.time} />
                  {w.studio && <FactRow label="Studio" value={w.floor ? `${w.studio} · ${w.floor}` : w.studio} />}
                  {w.level   && <FactRow label="Level"  value={w.level} />}
                  {w.attire  && <FactRow label="Attire" value={w.attire} />}
                </div>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </button>
    </motion.div>
  );
}

function FactRow({ label, value }) {
  return (
    <div className="flex items-baseline justify-between gap-4" style={{ borderBottom: "0.5px solid #EFEFEF", paddingBottom: 6 }}>
      <Eyebrow color="#8A8A8A">{label}</Eyebrow>
      <div style={{
        fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500, fontSize: 13, color: "#000",
        textAlign: "right", maxWidth: "22ch",
      }}>
        {value}
      </div>
    </div>
  );
}

/* ============================================================
   17. STAY CARD — per-teacher accommodation
   ============================================================ */
function StayCard({ teacher, stay }) {
  return (
    <div style={{ border: "1px solid #E0E0E0", borderRadius: 18 }}>
      <div className="p-6 sm:p-8">
        <div className="flex items-baseline justify-between flex-wrap gap-3 pb-4"
          style={{ borderBottom: "0.5px solid #D6D6D6" }}>
          <Eyebrow>Your stay</Eyebrow>
          <span style={{
            fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
            fontSize: 14, color: "#C44715",
          }}>
            {teacher.stay === "adagio" ? "10-min walk from Shoonya" : "right at the heart of the festivities"}
          </span>
        </div>
        <div className="grid sm:grid-cols-[1fr_auto] gap-6 mt-5">
          <div>
            <h3 style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
              fontSize: 22, lineHeight: 1.15, color: "#000", letterSpacing: "-0.005em", margin: 0,
            }}>
              {stay.name}
            </h3>
            <div className="mt-2" style={{ fontSize: 14, color: "#4A4A4A", lineHeight: 1.6 }}>
              {stay.addrLine1}<br/>{stay.addrLine2}
            </div>
            {/* Click-to-call reception line — only rendered when the stay
                has a phone (Adagio); the dorm doesn't, and falls back gracefully. */}
            {stay.phone && (
              <div className="mt-3" style={{ fontSize: 14, color: "#4A4A4A", lineHeight: 1.6 }}>
                <span style={{
                  fontFamily: "Inter, sans-serif", fontSize: 11,
                  letterSpacing: "0.18em", textTransform: "uppercase",
                  color: "#8A8A8A", marginRight: 8,
                }}>Reception</span>
                <a href={`tel:${stay.phoneTel}`}
                   style={{
                     color: "#C44715",
                     textDecoration: "none",
                     borderBottom: "0.5px solid #C44715",
                     fontFamily: "Inter, sans-serif",
                   }}>
                  {stay.phone}
                </a>
              </div>
            )}
            <p className="mt-4" style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic",
              fontSize: 14, lineHeight: 1.6, color: "#000", margin: 0, maxWidth: "55ch",
            }}>
              {stay.detail}
            </p>
          </div>
          <div className="self-end" style={{ minWidth: 120 }}>
            <Eyebrow color="#8A8A8A">Distance</Eyebrow>
            <div className="mt-1" style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500, fontSize: 16, color: "#000",
            }}>
              {teacher.stay === "adagio" ? "10 min" : "0 min"}
            </div>
            <div style={{ fontSize: 11, color: "#6B6B6B", marginTop: 2 }}>
              on foot
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   18. FLIGHT CONDITIONS — teacher-relevant only.
   Sourced from /Emails/Teachers' email *.docx + Swapnil's instructions
   on food vouchers, monitors, and music setup.
   ============================================================ */
const CONDITIONS = [
  { code: "ITN", title: "Travel itinerary",
    body: "Please share your travel itinerary with the Shoonya / ABC team once it's finalised. A team member will be paired with you to coordinate logistics throughout the festival." },
  { code: "MON", title: "Class monitor",
    body: "Every workshop has a class monitor — your point person before, during and after class. They handle timing, transitions, mics, group photos, and anything you need on the floor. Their name is on each session in your timeline." },
  { code: "AUX", title: "Music & sound",
    body: "Music plays via Bluetooth or a mini-jack cable from your laptop or phone. Need a wireless headset to teach? Ask your class monitor — we'll have one ready." },
  { code: "EAT", title: "Food & vouchers",
    body: "All meals are served at Shoonya — wide spread, vegetarian and vegan included. Each teacher gets food and drink vouchers for the bar. Tell us about any dietary needs in advance." },
  { code: "FIT", title: "Studio etiquette",
    body: "Studios are shoes-free. Leave outside shoes in the designated area on the ground floor. Changing rooms sit on the mezzanine and second floor — Studio Ananta is your dedicated dressing room on Gala day." },
  { code: "FIN", title: "Grand Finale tech",
    body: "All visiting teachers join the Grand Finale rehearsal at 19:50 on Saturday — Act 18 of the tech run. Be on stage at 19:50 sharp, in addition to your own act slot earlier." },
];

function FlightConditions() {
  return (
    <div style={{ border: "1px solid #E0E0E0", borderRadius: 18 }}>
      <div className="p-6 sm:p-8">
        <div className="flex items-baseline justify-between flex-wrap gap-3 pb-4"
          style={{ borderBottom: "0.5px solid #D6D6D6" }}>
          <Eyebrow>Flight conditions</Eyebrow>
          <span style={{
            fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
            fontSize: 14, color: "#C44715",
          }}>
            faculty information<Bindu />read once before take-off
          </span>
        </div>
        <div className="grid sm:grid-cols-2 gap-x-8 gap-y-5 mt-5">
          {CONDITIONS.map(c => (
            <div key={c.code} className="grid grid-cols-[44px_1fr] gap-3">
              <div className="tabular-nums pt-0.5" style={{
                fontFamily: "Inter, sans-serif", fontWeight: 500, fontSize: 10,
                letterSpacing: "0.18em", color: "#C44715",
              }}>
                {c.code}
              </div>
              <div>
                <div style={{
                  fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
                  fontSize: 16, lineHeight: 1.2, color: "#000",
                }}>
                  {c.title}
                </div>
                <p className="mt-1" style={{
                  fontFamily: "Inter, sans-serif", fontWeight: 400,
                  fontSize: 13, lineHeight: 1.6, color: "#4A4A4A", margin: 0,
                }}>
                  {c.body}
                </p>
              </div>
            </div>
          ))}
        </div>
        <div className="mt-6 pt-4" style={{ borderTop: "0.5px solid #D6D6D6", textAlign: "right" }}>
          <span style={{
            fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
            fontSize: 14, color: "#4A4A4A",
          }}>
            With warmth, Swapnil & Wim<Bindu />ABC
          </span>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   19. HEADS UP — stay reminder + closing dinner + contact
   ============================================================ */
function HeadsUp({ teacher }) {
  return (
    <div className="px-6 sm:px-8 py-9 sm:py-10" style={{
      background: "#000", borderTop: "1px solid #E85D1F", borderRadius: 18,
    }}>
      <Eyebrow color="#E85D1F">Heads up</Eyebrow>
      <h3 className="mt-3" style={{
        maxWidth: "30ch",
        fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
        fontSize: "clamp(22px, 3.5vw, 30px)", lineHeight: 1.1, color: "#fff",
        letterSpacing: "-0.005em", margin: 0,
      }}>
        A few details that{" "}
        <em style={{ fontStyle: "italic", color: "#E85D1F", fontWeight: 400 }}>matter on arrival.</em>
      </h3>
      <div className="mt-7 grid grid-cols-1 sm:grid-cols-2" style={{ borderTop: "0.5px solid #2A2A2A" }}>
        {teacher.stay === "dorm" ? (
          <SeparateRow
            name="Bring a towel"
            sub="The Shoonya dorm has a kitchenette and a shower — we provide everything else, but towels you'll want to pack."
            metaParts={["Stapelplein 41", "Kitchenette + shower", "Meals in-house"]}
            stat="Reminder" />
        ) : (
          <SeparateRow
            name="Adagio Dampoort check-in"
            sub="We'll walk you through everything you need for check-in. 10-min walk to the studio."
            metaParts={["Koopvaardijlaan 29", "9000 Gent", "→ Shoonya 10 min"]}
            stat="Aparthotel" />
        )}
        <SeparateRow
          name="Closing dinner at Wim & Swapnil's"
          sub="From ~19:30 on Sunday, after One Last Gupshup. Address shared in person. We always go out high-energy."
          metaParts={["Sunday", "~19:30 onwards", "after 18:00 close"]}
          stat="If you can stay" />
      </div>
      <div className="mt-8" style={{
        fontFamily: "'Playfair Display', Georgia, serif", fontStyle: "italic", fontWeight: 400,
        fontSize: 14, color: "#D6D6D6", lineHeight: 1.5,
      }}>
        Anything unclear? Reply to your registration email or write to{" "}
        <a href="mailto:info@shoonyadance.com" style={{ color: "#E85D1F", textDecoration: "none" }}>
          info@shoonyadance.com
        </a>
        {" "}— we'll sort it before you arrive.
      </div>
    </div>
  );
}

function SeparateRow({ name, sub, metaParts, stat }) {
  return (
    <div className="py-5 sm:py-6 sm:pr-6" style={{ borderBottom: "0.5px solid #2A2A2A" }}>
      <div style={{
        fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 500,
        fontSize: 20, lineHeight: 1.15, color: "#fff", letterSpacing: "-0.005em", margin: 0,
      }}>{name}</div>
      <div className="mt-1" style={{ fontSize: 13, color: "#D6D6D6" }}>{sub}</div>
      <div className="mt-2" style={{ fontSize: 12, color: "#9A9A9A", fontVariantNumeric: "tabular-nums" }}>
        {metaParts.map((part, i) => (
          <Fragment key={i}>{i > 0 && <Bindu />}{part}</Fragment>
        ))}
      </div>
      <div className="mt-3" style={{
        fontFamily: "Inter, sans-serif", fontWeight: 500, fontSize: 11,
        letterSpacing: "0.18em", textTransform: "uppercase",
        color: "#E85D1F",
      }}>
        {stat}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ArrivalJourney />);
</script>

</body>
</html>
